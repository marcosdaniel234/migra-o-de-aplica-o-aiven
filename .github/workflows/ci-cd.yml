name: CI/CD - Dashboard App

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/ci-cd.yml"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/dashboard-app

jobs:
  test:
    name: Testes e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        working-directory: app
        run: |
          pip install -r requirements.txt
          pip install flake8
      - name: Lint (flake8)
        working-directory: app
        run: flake8 . --max-line-length=100 --extend-ignore=E501,W503 --exit-zero
      - name: Checagem de sintaxe da aplicação
        working-directory: app
        run: python -m py_compile app.py bcb_client.py

  build-and-push:
    name: Build + push da imagem Docker
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy (Render)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Disparar deploy hook do Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -o /dev/null -X POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Health check pós-deploy
        env:
          APP_HEALTHCHECK_URL: ${{ secrets.APP_HEALTHCHECK_URL }}
        run: |
          sleep 45
          curl -fsS --retry 8 --retry-all-errors --retry-delay 10 --max-time 15 "${APP_HEALTHCHECK_URL%/}/healthz"
