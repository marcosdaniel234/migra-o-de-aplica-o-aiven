name: Infra - Provisionar Aiven (Terraform)

# O provisionamento é manual para que o plano seja escolhido antes do apply.
on:
  workflow_dispatch:
    inputs:
      pg_plan:
        description: Identificador do plano PostgreSQL disponível no projeto Aiven
        required: true
        type: string
      cloud_name:
        description: Identificador da nuvem compatível com o plano no projeto Aiven
        required: true
        type: string

concurrency:
  group: aiven-terraform
  cancel-in-progress: false

env:
  TF_VAR_pg_plan: ${{ inputs.pg_plan }}
  TF_VAR_cloud_name: ${{ inputs.cloud_name }}
  TF_VAR_aiven_api_token: ${{ secrets.AIVEN_API_TOKEN }}
  TF_VAR_aiven_project: ${{ secrets.AIVEN_PROJECT }}

jobs:
  terraform:
    name: Terraform plan/apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan

      - name: Mostrar host PostgreSQL
        if: github.ref == 'refs/heads/main'
        run: terraform output -raw pg_host
